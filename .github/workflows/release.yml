name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-14, target: macos-arm64 }
          # cryptography 49+ ships no Intel-macOS wheel; a source build links Homebrew's OpenSSL and the bundled
          # binary then crashes against Python's own libssl. 48.x still has a universal2 wheel.
          - { os: macos-15-intel, target: macos-x64, pin: "cryptography<49" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        shell: bash
        env:
          PIP_ONLY_BINARY: cryptography  # never compile it: a local build can't be bundled safely
          PIN: ${{ matrix.pin }}
        run: python -m pip install -e ".[dev,build]" ${PIN:+"$PIN"}

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(python -c 'import sentry_mcp; print(sentry_mcp.__version__)')" = "$GITHUB_REF_NAME"

      - name: Test (source)
        run: python -m pytest -q

      - name: Build executable and .mcpb
        run: python packaging/build.py

      - name: Test (built executable)
        shell: bash
        run: |
          export MCP_SERVER_UNDER_TEST="$(python packaging/build.py --print-binary)"
          python -m pytest -q tests/test_mcp_stdio.py

      - uses: actions/upload-artifact@v4
        with:
          name: sentry-mcp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
